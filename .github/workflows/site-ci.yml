name: Public website regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    env:
      SANZE_PUBLIC_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The build itself checks that public routes are open and assets exist.
      - run: npm run verify:evaluation-copy
      - run: npm run build
      - run: npm run verify:evaluation-delivery
      - run: node --test tests/article-copy.test.mjs
      - run: node --test tests/contact-audiences.test.mjs tests/landowner-calculation.test.mjs tests/land-development.test.mjs tests/line-ai.test.mjs tests/line-timeout.test.mjs tests/line-webhook.test.mjs tests/private-report-bundle.test.mjs
      - run: npm run verify:contact
      - run: npm run verify:assistant-guard
      - run: npm run verify:assistant-sql
      - run: node --test tests/website-ai-price-maintenance.test.mjs
      - run: node scripts/verify-website-recording.mjs
      - run: node scripts/verify-assistant-knowledge.mjs
      - run: node scripts/verify-landowner-guidance.mjs
      - run: node scripts/verify-website-assistant.mjs
      - run: node scripts/verify-pageview-tracker.mjs
      - run: node scripts/verify-traffic.mjs
      - run: node --test tests/traffic-dashboard.test.mjs
      - run: node scripts/verify-audience-tracking.mjs
